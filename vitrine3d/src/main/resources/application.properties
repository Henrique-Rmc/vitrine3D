spring.application.name=vitrine3d

# DataSource (PostgreSQL via Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/vitrine3d
spring.datasource.username=vitrine3d
spring.datasource.password=vitrine3d
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=vitrine3d

# JWT
jwt.secret=vitrine3d-jwt-secret-key-must-be-at-least-32-chars-change-in-prod
jwt.expiration=86400000

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/api-docs/json
