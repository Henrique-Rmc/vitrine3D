spring.application.name=vitrine3d

# Commit em execução (ver VersionController) — definido via GIT_COMMIT no build da imagem.
app.version.commit=${GIT_COMMIT:unknown}

# DataSource (PostgreSQL)
# Produção: defina DB_URL, DB_USERNAME e DB_PASSWORD como variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vitrine3d}
spring.datasource.username=${DB_USERNAME:vitrine3d}
spring.datasource.password=${DB_PASSWORD:vitrine3d}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=validate: Hibernate verifica o schema mas nunca o altera.
# Todas as mudanças de schema vêm exclusivamente das migrations Flyway em db/migration/.
# Para sobrescrever localmente (ex.: reset de banco de testes): DDL_AUTO=create-drop
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway — controle de versão do schema
# baseline-on-migrate: para bancos existentes sem flyway_schema_history, marca a versão atual
#   como V1 (sem executar o script V1) e roda V2+ em diante.
# baseline-version=1: o banco já tem o schema da V1 (criado pelo ddl-auto=update anterior).
# out-of-order=false: impede aplicar V3 se V2 ainda não rodou — protege a ordem.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration

# MinIO / S3-compatible (MinIO, AWS S3, Cloudflare R2, ...)
# Produção: defina MINIO_ENDPOINT, MINIO_ACCESS_KEY e MINIO_SECRET_KEY como variáveis de ambiente
# MINIO_PUBLIC_ENDPOINT é a URL base usada nas imagens públicas — já deve incluir o que for
# necessário no path (MinIO: http://host:9000/<bucket>; R2: URL do r2.dev ou domínio customizado,
# sem o nome do bucket, pois o R2 já mapeia direto pra raiz do bucket).
# MINIO_REGION: MinIO ignora; R2 exige "auto"; AWS S3 exige a região real do bucket.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000/vitrine3d}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:vitrine3d}
minio.region=${MINIO_REGION:us-east-1}

# JWT — access token de curta duração (refresh token cuida da sessão longa)
# Produção: defina JWT_SECRET como variável de ambiente (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:vitrine3d-jwt-secret-key-must-be-at-least-32-chars-change-in-prod}
jwt.expiration=${JWT_EXPIRATION:900000}

# Refresh token — sessão de 30 dias, renovada silenciosamente pelo frontend
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}
# Produção: defina COOKIE_SECURE=true (exige HTTPS)
app.refresh-token.cookie-secure=${COOKIE_SECURE:false}
# Produção com frontend em domínio diferente (ex.: Vercel + Render): "None" é obrigatório,
# senão o navegador não reenvia o cookie em chamadas cross-site. Exige cookie-secure=true junto.
app.refresh-token.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# Upload limits (first line of defense — Spring rejects before the controller)
# max-file-size continua por arquivo individual; max-request-size precisa caber ate 5
# arquivos (produto pode ter varias fotos) + a parte JSON "data" do multipart.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=12MB

# Redis
# Produção (ex.: Upstash): defina REDIS_PASSWORD e REDIS_SSL=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/api-docs/json

# Keep-alive interno (ping em Postgres+Redis periodicamente, ver KeepAliveScheduler) — evita
# cold start do Neon/Upstash enquanto a instância estiver de pé. Não substitui um pinger
# externo batendo em GET /api/health pra evitar a própria instância suspender por falta de
# tráfego HTTP (ex.: Render free tier).
app.keep-alive.enabled=${KEEP_ALIVE_ENABLED:true}
app.keep-alive.initial-delay-ms=${KEEP_ALIVE_INITIAL_DELAY_MS:60000}
app.keep-alive.interval-ms=${KEEP_ALIVE_INTERVAL_MS:240000}

# Admin seed — sobrescreva com variáveis de ambiente em produção
app.admin.email=${ADMIN_EMAIL:admin@vitrine3d.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@12345}
