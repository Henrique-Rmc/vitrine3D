# Profile de produção — ative com SPRING_PROFILES_ACTIVE=prod.
# Sobrescreve os defaults inseguros de application.properties. As variáveis abaixo NÃO têm
# fallback: se estiverem ausentes, a aplicação falha ao subir em vez de usar um valor inseguro.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Nunca alterar o schema automaticamente em produção — "validate" é o default.
# Exceção: no primeiro boot contra um banco vazio (ex.: Neon recém-criado), defina
# DDL_AUTO=update uma única vez para o Hibernate criar as tabelas, depois REMOVA a env var
# (volta pro default "validate") ou redeploy sem ela.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

minio.endpoint=${MINIO_ENDPOINT}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET}
minio.region=${MINIO_REGION:us-east-1}

jwt.secret=${JWT_SECRET}

# Cookies de refresh token exigem HTTPS em produção.
app.refresh-token.cookie-secure=true

# CORS — lista explícita de origens, sem wildcard. Ex.: https://app.vitrine3d.com,https://vitrine3d.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Documentação da API não deve ficar exposta publicamente em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN
logging.level.com.store.vitrine3d=INFO
