name: Keep-alive ping

# Mantém o backend (Render free tier), o Postgres (Neon) e o Redis (Upstash) acordados.
# O /api/health faz um round-trip real em DB e Redis (ver HealthCheckService), então um
# único ping aqui já cobre os três — não precisa bater em cada serviço separadamente.
#
# Frequência: a cada 5 minutos, deslocado dos minutos redondos (:02, :07, :12...). O Render
# suspende a instância após ~15min sem tráfego HTTP e o Neon suspende o compute após ~5min
# sem query — o Neon suspender entre pings é inofensivo (a próxima chamada a /api/health já
# acorda ele, só adiciona ~500ms àquela resposta). O que precisa ser evitado é o Render
# suspender, e o GitHub documenta que jobs agendados para horários redondos (:00, :10, :20...)
# sofrem mais atraso/são ocasionalmente pulados por concentração de carga — daí o deslocamento
# e o intervalo mais apertado, dando margem mesmo se uma execução atrasar ou for pulada.
#
# Aviso: o GitHub desativa workflows agendados automaticamente após 60 dias sem nenhum
# commit no repositório. Se o deploy ficar muito tempo sem receber push, reative manualmente
# em Actions → Keep-alive ping → "Enable workflow" (ou dê qualquer commit antes disso).

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vitrine3d-latest.onrender.com/api/health)
            echo "Tentativa $attempt — status: $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check retornou status $status após 3 tentativas (esperado 200)"
          exit 1
