name: Keep-alive ping

# Mantém o backend (Render free tier), o Postgres (Neon) e o Redis (Upstash) acordados.
# O /api/health faz um round-trip real em DB e Redis (ver HealthCheckService), então um
# único ping aqui já cobre os três — não precisa bater em cada serviço separadamente.
#
# Frequência: a cada 10 minutos. O Render suspende a instância após ~15min sem tráfego HTTP
# e o Neon suspende o compute após ~5min sem query — 10min dá margem segura pros dois,
# considerando que o agendamento do GitHub Actions pode atrasar alguns minutos em horários
# de pico.
#
# Aviso: o GitHub desativa workflows agendados automaticamente após 60 dias sem nenhum
# commit no repositório. Se o deploy ficar muito tempo sem receber push, reative manualmente
# em Actions → Keep-alive ping → "Enable workflow" (ou dê qualquer commit antes disso).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vitrine3d-latest.onrender.com/api/health)
          echo "Status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Health check retornou status $status (esperado 200)"
            exit 1
          fi
